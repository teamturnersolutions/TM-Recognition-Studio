services:
  tm-recognition-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: tm-recognition-studio:0.1.0
    container_name: tm-recognition-studio
    restart: unless-stopped
    privileged: false
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${APP_PORT:-8080}:8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Optional: Mount an external read-only template directory to add or replace
    # template packages without rebuilding the container image:
    # volumes:
    #   - ./custom-templates:/usr/share/nginx/html/templates:ro
